name: Update 123.csv daily

on:
  schedule:
    # GitHub Actions cron is always UTC.
    # 18:00 SAST (Cape Town, UTC+2) = 16:00 UTC.
    - cron: "40 15 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write  # needed so the workflow can push commits back to the repo

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run push script
        run: python push_csv.py
